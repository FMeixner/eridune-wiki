<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Destilliertes Wiki von Eridune — Welt, Macht und Mythen der Daggerheart-Kampagne.">
<title>Eridune-Wiki</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap");

:root {
  --bg: #131109;
  --bg-panel: #191509;
  --bg-card: #1f1a0e;
  --bg-hover: #262012;
  --border: #3b3319;
  --border-soft: #2b2513;
  --text: #d8d2bf;
  --muted: #948b70;
  --faint: #6e6750;
  --gold: #c8c477;
  --gold-bright: #d6d08a;
  --link: #d6d08a;
  --ok: #7fa262;
  --warn: #c9922e;
  --bad: #b06060;
  --serif: "Crimson Pro", Georgia, serif;
  --brand: "IM Fell English SC", "Crimson Pro", serif;
  --sans: "Crimson Pro", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16.5px; line-height: 1.65; }

::selection { background: rgba(200,196,119,.28); }

a { color: var(--link); text-decoration: none; border-bottom: 1px solid rgba(214,208,138,.35); transition: color .15s, border-color .15s; }
a:hover { color: var(--gold-bright); border-bottom-color: var(--gold-bright); }

/* ---------- Layout ---------- */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 292px;
  background: linear-gradient(180deg, #191509 0%, #15120a 100%);
  border-right: 1px solid var(--border-soft);
  overflow-y: auto; overscroll-behavior: contain;
  z-index: 40; scrollbar-width: thin; scrollbar-color: #332c15 transparent;
}
.main { margin-left: 292px; min-height: 100vh; }
.content { max-width: 790px; margin: 0 auto; padding: 52px 56px 90px; animation: fadein .28s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Sidebar ---------- */
.brand { padding: 26px 22px 16px; border-bottom: 1px solid var(--border-soft); }
.brand-row { display: flex; align-items: center; gap: 12px; }
.brand-star { flex: 0 0 auto; color: var(--gold); }
.brand-name { font-family: var(--brand); font-size: 21px; font-weight: 700; letter-spacing: .22em; color: #e7e0cd; }
.brand-sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); letter-spacing: .05em; }
.brand-stand { margin-top: 10px; display: inline-block; font-size: 12px; color: var(--faint); border: 1px solid var(--border-soft); border-radius: 999px; padding: 2px 10px; }

.search-wrap { padding: 16px 18px 6px; position: relative; }
#search {
  width: 100%; background: var(--bg-card); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px 8px 34px; font-family: var(--sans); font-size: 14.5px; outline: none;
  transition: border-color .15s;
}
#search:focus { border-color: var(--gold); }
.search-icon { position: absolute; left: 29px; top: 27px; color: var(--faint); pointer-events: none; }
#search-results {
  position: absolute; top: 54px; left: 18px; right: 18px; z-index: 60;
  background: #1c180d; border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 12px 30px rgba(0,0,0,.55); max-height: 60vh; overflow-y: auto; display: none;
}
#search-results.open { display: block; }
.sr-item { display: block; padding: 10px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: var(--bg-hover); }
.sr-title { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; }
.sr-title .type-ic { color: var(--gold); flex: 0 0 auto; }
.sr-snippet { margin-top: 3px; font-size: 13px; color: var(--muted); line-height: 1.45; }
.sr-snippet mark { background: rgba(200,196,119,.3); color: var(--gold-bright); padding: 0 2px; border-radius: 2px; }
.sr-empty { padding: 12px 14px; color: var(--faint); font-size: 14px; }

nav.wikinav { padding: 8px 0 30px; }
.navgroup { margin-top: 12px; }
.navgroup > summary {
  list-style: none; cursor: pointer; user-select: none;
  padding: 5px 22px; font-size: 11.5px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--faint);
  display: flex; align-items: center; justify-content: space-between;
}
.navgroup > summary::-webkit-details-marker { display: none; }
.navgroup > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(-45deg); transition: transform .15s; margin-right: 4px; }
.navgroup[open] > summary::after { transform: rotate(45deg); }
.navgroup > summary:hover { color: var(--muted); }
.navgroup > ul { list-style: none; margin: 3px 0 0; padding: 0; }
.navitem {
  display: flex; align-items: center; gap: 9px;
  padding: 4.5px 22px 4.5px 20px; border-left: 2px solid transparent;
  color: var(--muted); font-size: 14.5px; cursor: pointer; transition: color .12s, background .12s;
}
.navitem:hover { color: var(--text); background: rgba(255,255,255,.02); }
.navitem.active { color: var(--gold-bright); border-left-color: var(--gold); background: rgba(200,196,119,.06); }
.navitem .type-ic { flex: 0 0 auto; opacity: .75; }
.navcount { margin-left: auto; font-size: 11.5px; color: var(--faint); }
.nav-star { flex: 0 0 auto; color: var(--gold); opacity: .85; }

/* ---------- Seitenkopf ---------- */
.page-head { margin-bottom: 30px; }
.page-head .rule { height: 1px; background: linear-gradient(90deg, rgba(200,196,119,.55), rgba(200,196,119,.08) 60%, transparent); margin: 0 0 22px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.eyebrow svg { opacity: .9; }
h1.page-title {
  font-family: var(--brand); font-weight: 600; font-size: 40px; line-height: 1.15;
  margin: 8px 0 0; color: #e6dfc6; letter-spacing: .03em;
}
.page-meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 2.5px 12px; font-size: 13px; color: var(--text);
  background: var(--bg-card); transition: border-color .15s, color .15s;
}
a.chip { border-bottom: 1px solid var(--border); }
a.chip:hover { border-color: var(--gold); color: var(--gold-bright); border-bottom-color: var(--gold); }
.chip.status-ok { border-color: rgba(127,162,98,.55); color: #a4c186; }
.chip.status-warn { border-color: rgba(201,146,46,.55); color: #dba75c; }
.chip.status-bad { border-color: rgba(176,96,96,.55); color: #d28d8d; }
.kurz { margin-top: 14px; font-family: var(--serif); font-size: 19.5px; font-style: italic; color: #b5af9f; line-height: 1.5; }

/* ---------- Artikel ---------- */
.article h2 { font-family: var(--serif); font-weight: 600; font-size: 27px; color: #d4c66a; margin: 40px 0 12px; letter-spacing: .02em; }
.article h2:first-child { margin-top: 18px; }
.article h3 { font-family: var(--serif); font-weight: 600; font-size: 21px; color: #d0c585; margin: 28px 0 10px; }
.article p { margin: 0 0 14px; }
.article ul { margin: 0 0 16px; padding-left: 6px; list-style: none; }
.article ul > li { position: relative; padding-left: 22px; margin-bottom: 9px; }
.article ul > li::before {
  content: ""; position: absolute; left: 4px; top: .62em;
  width: 7px; height: 7px; transform: rotate(45deg);
  background: transparent; border: 1.5px solid var(--gold); opacity: .75;
}
.article blockquote { margin: 18px 0; padding: 10px 18px; border-left: 3px solid var(--border); color: var(--muted); background: rgba(255,255,255,.02); }
.article hr { border: none; height: 1px; background: var(--border-soft); margin: 28px 0; }
.article code { background: #262012; border: 1px solid var(--border-soft); border-radius: 4px; padding: 1px 5px; font-size: .9em; color: #cfc8b0; }
.wikilink-missing { color: var(--muted); border-bottom: 1px dotted var(--faint); cursor: help; }

.link-cloud { line-height: 2.3; }
.link-cloud a { border: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 999px; padding: 2px 12px; background: var(--bg-card); }
.link-cloud a:hover { border-color: var(--gold); }

/* Callouts */
.callout { border-radius: 10px; padding: 14px 18px; margin: 20px 0; background: rgba(201,146,46,.07); border: 1px solid rgba(201,146,46,.4); border-left: 3px solid var(--warn); }
.callout-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; letter-spacing: .03em; color: var(--warn); margin-bottom: 6px; }
.callout p { margin: 0; color: #c4bda9; font-size: 15px; }

/* Timeline */
.timeline-intro { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--muted); margin-bottom: 26px; }
.session-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
  padding: 0; margin-bottom: 14px; position: relative; overflow: hidden;
}
.session-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--gold), rgba(200,196,119,.15)); }
details.session-card[open] { border-color: rgba(200,196,119,.4); }
details.session-card > summary { list-style: none; cursor: pointer; padding: 16px 24px 14px; }
details.session-card > summary::-webkit-details-marker { display: none; }
details.session-card > summary:hover .session-title { color: #efe8cd; }
.session-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.session-num { font-family: var(--brand); font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--gold); border: 1px solid rgba(200,196,119,.45); border-radius: 4px; padding: 3px 9px; white-space: nowrap; }
.session-title { font-family: var(--serif); font-weight: 600; font-size: 23px; color: #e0d8bc; margin: 0; }
.session-date { margin-left: auto; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.session-chev { flex: 0 0 auto; align-self: center; margin-left: 10px; color: var(--faint); transition: transform .18s ease, color .18s ease; }
details.session-card[open] .session-chev { transform: rotate(180deg); color: var(--gold); }
.session-body { padding: 0 24px 16px; }
.session-meta { display: flex; flex-direction: column; gap: 7px; margin: 0 0 4px; }
.tl-controls { display: flex; gap: 10px; margin: 0 0 18px; }
.tl-btn {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 999px; padding: 4px 16px; font-family: var(--sans); font-size: 13px;
  cursor: pointer; transition: border-color .15s, color .15s;
}
.tl-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
.chip-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.chip-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); width: 86px; flex: 0 0 auto; }
.session-event { margin: 12px 0 0; font-size: 15.5px; }
.session-source { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--border-soft); font-size: 13px; color: var(--faint); font-style: italic; }

/* Backlinks & Footer */
.backlinks { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--border-soft); }
.backlinks-label { font-size: 11.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
.page-footer { margin-top: 26px; font-size: 12.5px; color: var(--faint); font-style: italic; }

/* States */
.loading { color: var(--faint); font-family: var(--serif); font-style: italic; font-size: 19px; padding: 40px 0; text-align: center; }
.error-card { border: 1px solid rgba(176,96,96,.5); background: rgba(176,96,96,.07); border-radius: 12px; padding: 26px 30px; }
.error-card h2 { font-family: var(--serif); color: #d28d8d; margin: 0 0 8px; }

#menu-toggle {
  display: none; position: fixed; top: 12px; left: 12px; z-index: 50;
  background: var(--bg-card); color: var(--gold); border: 1px solid var(--border); border-radius: 8px;
  width: 40px; height: 40px; cursor: pointer; align-items: center; justify-content: center;
}
#nav-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 35; }

@media (max-width: 920px) {
  .sidebar { transform: translateX(-100%); transition: transform .22s ease; box-shadow: none; }
  body.nav-open .sidebar { transform: none; box-shadow: 12px 0 40px rgba(0,0,0,.5); }
  body.nav-open #nav-backdrop { display: block; }
  #menu-toggle { display: flex; }
  .main { margin-left: 0; }
  .content { padding: 64px 22px 70px; }
  h1.page-title { font-size: 31px; }
}
</style>
</head>

    var lines = md.split("\n"), out = [], i = 0, m;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
        var lvl = m[1].length;
        out.push("<h" + lvl + ">" + fbInline(m[2]) + "</h" + lvl + ">"); i++; continue;
      }
      if (/^\s*[-*]\s/.test(line)) {
        out.push("<ul>");
        while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) {
          out.push("<li>" + fbInline(lines[i].replace(/^\s*[-*]\s/, "")) + "</li>"); i++;
        }
        out.push("</ul>"); continue;
      }
      if (/^\s*\d+\.\s/.test(line)) {
        out.push("<ul>");
        while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) {
          out.push("<li>" + fbInline(lines[i].replace(/^\s*\d+\.\s/, "")) + "</li>"); i++;
        }
        out.push("</ul>"); continue;
      }
      if (/^>/.test(line)) {
        out.push("<blockquote>");
        while (i < lines.length && /^>/.test(lines[i])) {
          out.push(fbInline(lines[i].replace(/^>\s?/, ""))); i++;
        }
        out.push("</blockquote>"); continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*]\s|\s*\d+\.\s|^>)/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push("<p>" + fbInline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  /* ---------- Wikilinks ---------- */
  function resolveName(name) {
    var key = String(name).trim().toLowerCase();
    return nameIndex[key] || null;
  }
  function wikilinkHtml(target, label) {
    label = (label || target).trim();
    var entry = resolveName(target);
    if (entry) return '<a href="#/' + encodePath(entry.path) + '">' + escapeHtml(label) + "</a>";
    return '<span class="wikilink-missing" title="Noch keine eigene Seite">' + escapeHtml(label) + "</span>";
  }
  function replaceWikilinks(md) {
    return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (w, t, l) { return wikilinkHtml(t, l); });
  }

  /* ---------- Callouts ---------- */
  function transformCallouts(html) {
    var tpl = document.createElement("template");
    tpl.innerHTML = html;
    var quotes = Array.prototype.slice.call(tpl.content.querySelectorAll("blockquote"));
    quotes.forEach(function (q) {
      var first = q.firstElementChild;
      if (!first) return;
      var m = (first.textContent || "").match(/^\[!(\w+)\]\s*(.*)$/);
      if (!m) return;
      var type = m[1].toLowerCase();
      var div = document.createElement("div");
      div.className = "callout callout-" + type;
      var head = document.createElement("div");
      head.className = "callout-title";
      head.innerHTML = (ICONS.warn || "") + "<span>" + escapeHtml(m[2]) + "</span>";
      first.remove();
      div.appendChild(head);
      while (q.firstChild) div.appendChild(q.firstChild);
      q.replaceWith(div);
    });
    return tpl.innerHTML;
  }

  function mdToHtml(md) {
    var html;
    if (window.marked && marked.parse) { try { html = marked.parse(md); } catch (e) { html = fbMarkdown(md); } }
    else html = fbMarkdown(md);
    return transformCallouts(html);
  }

  /* ---------- Manifest laden ---------- */
  function loadManifest() {
    return fetch(MANIFEST_URL).then(function (r) {
      if (!r.ok) throw new Error("manifest.json nicht erreichbar (" + r.status + ")");
      return r.json();
    }).then(function (data) {
      manifest = data;
      manifest.pages.forEach(function (p) {
        p.aliases = p.aliases || [];
        pathIndex[p.path] = p;
        nameIndex[basename(p.path).toLowerCase()] = p;
        p.aliases.forEach(function (a) { nameIndex[a.toLowerCase()] = p; });
      });
      if (manifest.coverage) standEl.textContent = manifest.coverage;
      buildSidebar();
    });
  }

  /* ---------- Sidebar ---------- */
  function buildSidebar() {
    var pages = manifest.pages.slice();
    function byType(t) { return pages.filter(function (p) { return p.type === t; }); }
    var used = {};
    var groups = [
      { label: "Eridune", open: true, items: [pathIndex["index"], pathIndex["Eridune"]] },
      { label: "Orte", open: true, items: byType("ort").filter(function (p) { return p.path !== "Eridune"; }) },
      { label: "Spielercharaktere", open: true, items: byType("spielercharakter") },
      { label: "Personen", open: true, items: byType("person") },
      { label: "Häuser", open: true, items: byType("haus") },
      { label: "Völker", open: true, items: byType("volk") },
      { label: "Fraktionen", open: true, items: byType("fraktion") },
      { label: "Konzepte", open: true, items: byType("konzept") },
      { label: "Verkehr", open: true, items: byType("verkehr") },
      { label: "Kreaturen", open: true, items: byType("kreatur") },
      { label: "Sprache", open: true, items: byType("sprache") },
      { label: "Mythen", open: true, items: byType("mythus") },
      { label: "Artefakte", open: true, items: byType("artefakt") },
      { label: "Tiere", open: true, items: byType("tier") },
      { label: "SL-Werkzeuge", open: false, items: pages.filter(function (p) { return p.type === "sl_werkzeug" || p.type === "vorlage"; }) }
    ];
    groups.forEach(function (g) {
      g.items = (g.items || []).filter(Boolean);
      g.items.forEach(function (p) { used[p.path] = true; });
    });
    groups.push({ label: "Sonstiges", open: false, items: pages.filter(function (p) { return !used[p.path]; }) });
    groups.forEach(function (g) {
      if (!g.items || g.items.length === 0) return;
      g.items.sort(function (a, b) { return (b.w || 0) - (a.w || 0) || a.title.localeCompare(b.title, "de"); });
      var det = document.createElement("details");
      det.className = "navgroup";
      if (g.open) det.open = true;
      var sum = document.createElement("summary");
      sum.textContent = g.label + " · " + g.items.length;
      det.appendChild(sum);
      var ul = document.createElement("ul");
      g.items.forEach(function (p) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "navitem";
        a.href = "#/" + encodePath(p.path);
        a.dataset.path = p.path;
        a.innerHTML = (ICONS[p.held ? "held" : p.type] || "") + "<span>" + escapeHtml(p.title) + "</span>" + ((p.w || 0) >= 70 ? '<svg class="nav-star" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-label="Zentraler Eintrag"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>' : "");
        a.addEventListener("click", function () { document.body.classList.remove("nav-open"); });
        li.appendChild(a);
        ul.appendChild(li);
      });
      det.appendChild(ul);
      navEl.appendChild(det);
    });
  }
  function markActive(path) {
    navEl.querySelectorAll(".navitem").forEach(function (a) {
      a.classList.toggle("active", a.dataset.path === path);
    });
  }

  /* ---------- Seiten laden & rendern ---------- */
  function fetchPage(path) {
    if (pageCache[path]) return Promise.resolve(pageCache[path]);
    var url = "content/" + encodePath(path) + ".md";
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("Seite nicht gefunden (" + r.status + ")");
      return r.text();
    }).then(function (raw) {
      var parsed = parseFrontmatter(raw);
      pageCache[path] = parsed;
      return parsed;
    });
  }

  function statusClass(s) {
    if (!s) return "";
    s = s.toLowerCase();
    if (/lebendig|bei der Gruppe|aktiv|gesund/.test(s)) return "status-ok";
    if (/tot|gestorben|gefallen|zerstört/.test(s)) return "status-bad";
    if (/überfallen|verlassen|verschwunden|unbekannt|beschädigt|verloren/.test(s)) return "status-warn";
    return "";
  }

  function stripLeadingH1(body) {
    return body.replace(/^\s*#\s+[^\n]*\n+/, "");
  }

  function renderHeader(entry, data) {
    var fm = data.fm || {};
    var title = fm.title || entry.title || basename(entry.path);
    var html = '<div class="page-head"><div class="rule"></div>';
    html += '<div class="eyebrow">' + (ICONS[entry.held ? "held" : entry.type] || "") + " " + escapeHtml(TYPE_LABELS[entry.held ? "held" : entry.type] || "Eintrag") + "</div>";
    html += '<h1 class="page-title">' + escapeHtml(title) + "</h1>";
    var meta = "";
    if (fm.status) meta += '<span class="chip status ' + statusClass(fm.status) + '">' + escapeHtml(fm.status) + "</span>";
    if (fm.aliases && fm.aliases.length) meta += '<span class="chip">auch: ' + fm.aliases.map(escapeHtml).join(", ") + "</span>";
    if (meta) html += '<div class="page-meta">' + meta + "</div>";
    if (fm.kurz) html += '<p class="kurz">' + escapeHtml(fm.kurz) + "</p>";
    html += "</div>";
    return html;
  }

  function extractLinks(value) {
    var out = [];
    var re = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
    var m;
    while ((m = re.exec(value)) !== null) out.push(wikilinkHtml(m[1], m[2]));
    return out;
  }

  function renderTimeline(body) {
    var lines = body.split("\n");
    var sessions = [];
    var intro = [];
    var cur = null;
    lines.forEach(function (line) {
      var hm = line.match(/^##\s+Session\s+(\d+)\s*[-–—]\s*(.*)$/);
      if (hm) {
        cur = { num: hm[1], title: hm[2], datum: "", ort: [], bet: [], ereignis: [], quelle: "" };
        sessions.push(cur);
        return;
      }
      if (cur) {
        var m;
        if ((m = line.match(/^- Datum \(in-world\):\s*(.*)$/))) cur.datum = m[1];
        else if ((m = line.match(/^- Orte:\s*(.*)$/))) cur.ort = extractLinks(m[1]);
        else if ((m = line.match(/^- Beteiligte:\s*(.*)$/))) cur.bet = extractLinks(m[1]);
        else if ((m = line.match(/^- Ereignis:\s*(.*)$/))) cur.ereignis.push(m[1]);
        else if ((m = line.match(/^- Quelle:\s*(.*)$/))) cur.quelle += m[1];
      } else {
        if (/^#\s/.test(line) || !line.trim()) return;
        intro.push(line);
      }
    });
    if (sessions.length === 0) return mdToHtml(replaceWikilinks(stripLeadingH1(body)));
    var html = "";
    if (intro.length) html += '<p class="timeline-intro">' + mdToHtml(replaceWikilinks(intro.join(" "))) + "</p>";
    html += '<div class="tl-controls"><button class="tl-btn" data-tl="open" type="button">Alle aufklappen</button><button class="tl-btn" data-tl="close" type="button">Alle zuklappen</button></div>';
    sessions.forEach(function (s, idx) {
      html += '<details class="session-card"' + (idx === sessions.length - 1 ? " open" : "") + ">";
      html += '<summary class="session-head">';
      html += '<span class="session-num">Session ' + s.num + "</span>";
      html += '<h3 class="session-title">' + escapeHtml(s.title) + "</h3>";
      if (s.datum) html += '<span class="session-date">' + escapeHtml(s.datum) + "</span>";
      html += '<svg class="session-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      html += "</summary>";
      html += '<div class="session-body">';
      var chips = function (label, arr) {
        if (!arr.length) return "";
        return '<div class="chip-row"><span class="chip-label">' + label + "</span>" + arr.join("") + "</div>";
      };
      html += '<div class="session-meta">' + chips("Orte", s.ort) + chips("Beteiligte", s.bet) + "</div>";
      if (s.ereignis.length) {
        html += '<p class="session-event">' + mdToHtml(replaceWikilinks(s.ereignis.join(" "))).replace(/^<p>|<\/p>$/g, "") + "</p>";
      }
      if (s.quelle) html += '<div class="session-source">Quelle: ' + escapeHtml(s.quelle) + "</div>";
      html += "</div></details>";
    });
    return html;
  }

  function renderBacklinks(entry) {
    if (!searchReady) return "";
    var name = basename(entry.path).toLowerCase();
    var aliases = entry.aliases || [];
    var re = new RegExp("\\[\\[\\s*(?:" + [name].concat(aliases).map(function (n) { return n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")\\s*(?:\\||\\]\\])", "i");
    var hits = [];
    Object.keys(pageCache).forEach(function (p) {
      if (p === entry.path) return;
      if (re.test(pageCache[p].raw)) hits.push(pathIndex[p]);
    });
    hits.sort(function (a, b) { return a.title.localeCompare(b.title, "de"); });
    if (!hits.length) return "";
    var html = '<div class="backlinks"><div class="backlinks-label">Erwähnt in</div><div class="chip-row">';
    hits.forEach(function (h) {
      html += '<a class="chip" href="#/' + encodePath(h.path) + '">' + escapeHtml(h.title) + "</a>";
    });
    return html + "</div></div>";
  }

  function decorateUebersicht(root) {
    root.querySelectorAll("p").forEach(function (p) {
      var links = p.querySelectorAll("a");
      if (links.length >= 4 && (p.textContent.match(/·/g) || []).length >= 3) p.classList.add("link-cloud");
    });
  }

  function route() {
    var raw = location.hash.replace(/^#\/?/, "");
    var path = raw ? raw.split("/").map(decodeURIComponent).join("/") : "index";
    var entry = pathIndex[path] || resolveName(path);
    if (entry) path = entry.path, entry = pathIndex[path];
    contentEl.innerHTML = '<div class="loading">Lade Eridune …</div>';
    markActive(entry ? entry.path : null);

    if (!entry) {
      contentEl.innerHTML = '<div class="error-card"><h2>Kein Eintrag gefunden</h2><p>Für „' + escapeHtml(path) + "“ existiert keine Seite. Vielleicht ein veralteter Link — die Übersicht hilft weiter.</p></div>";
      document.title = "Unbekannt · Eridune-Wiki";
      return;
    }

    fetchPage(entry.path).then(function (data) {
      currentEntry = entry;
      var fm = data.fm || {};
      var body = data.body;
      var html = renderHeader(entry, data);
      var inner;
      if (entry.type === "timeline") inner = renderTimeline(body);
      else inner = mdToHtml(replaceWikilinks(stripLeadingH1(body)));
      html += '<div class="article">' + inner + "</div>";
      html += renderBacklinks(entry);
      html += '<div class="page-footer">Destillat von Eridune — hier stehen die Kernfakten; die Prosa bleibt im Original.</div>';
      contentEl.innerHTML = html;
      if (entry.type === "uebersicht") decorateUebersicht(contentEl);
      document.title = (fm.title || entry.title) + " · Eridune-Wiki";
      window.scrollTo(0, 0);
      ensureSearchIndex();
    }).catch(function (err) {
      contentEl.innerHTML = '<div class="error-card"><h2>Seite konnte nicht geladen werden</h2><p>' + escapeHtml(err.message) + "</p></div>";
    });
  }

  /* ---------- Suchindex ---------- */
  function ensureSearchIndex() {
    if (searchReady || searchKicking) return;
    searchKicking = true;
    var paths = manifest.pages.map(function (p) { return p.path; });
    var queue = paths.slice();
    function worker() {
      if (!queue.length) {
        if (Object.keys(pageCache).length >= paths.length) {
          searchReady = true;
          searchKicking = false;
          if (currentEntry) {
            var bl = contentEl.querySelector(".backlinks");
            var html = renderBacklinks(currentEntry);
            if (html && !bl) contentEl.insertAdjacentHTML("beforeend", html);
          }
          if (searchInput.value.trim()) runSearch();
        }
        return;
      }
      var p = queue.shift();
      fetchPage(p).then(worker).catch(worker);
    }
    for (var i = 0; i < 8; i++) worker();
  }

  /* ---------- Suche ---------- */
  var searchTimer = null;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 140);
  });
  searchInput.addEventListener("focus", function () {
    if (searchInput.value.trim()) runSearch();
    ensureSearchIndex();
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrap")) searchResults.classList.remove("open");
  });

  function snippet(text, q) {
    var idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx < 0) return null;
    var start = Math.max(0, idx - 55);
    var end = Math.min(text.length, idx + q.length + 70);
    var s = (start > 0 ? "… " : "") + text.slice(start, end) + (end < text.length ? " …" : "");
    var esc = escapeHtml(s);
    var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return esc.replace(re, "<mark>$1</mark>");
  }

  function runSearch() {
    var q = searchInput.value.trim();
    if (!q) { searchResults.classList.remove("open"); searchResults.innerHTML = ""; return; }
    if (!searchReady) {
      searchResults.innerHTML = '<div class="sr-empty">Suchindex wird geladen … einen Moment.</div>';
      searchResults.classList.add("open");
      ensureSearchIndex();
      return;
    }
    var ql = q.toLowerCase();
    var results = [];
    manifest.pages.forEach(function (p) {
      var score = 0;
      var t = p.title.toLowerCase();
      if (t.startsWith(ql)) score = 12;
      else if (t.indexOf(ql) >= 0) score = 9;
      else if ((p.aliases || []).some(function (a) { return a.toLowerCase().indexOf(ql) >= 0; })) score = 6;
      var data = pageCache[p.path];
      if (data) {
        if (data.raw.toLowerCase().indexOf(ql) >= 0) score = Math.max(score, 4);
      }
      if (score > 0) results.push({ p: p, score: score + Math.min(4, (p.w || 0) / 25) });
    });
    results.sort(function (a, b) { return b.score - a.score || (b.p.w || 0) - (a.p.w || 0) || a.p.title.localeCompare(b.p.title, "de"); });
    results = results.slice(0, 12);
    if (!results.length) {
      searchResults.innerHTML = '<div class="sr-empty">Nichts gefunden — die Welt schweigt.</div>';
      searchResults.classList.add("open");
      return;
    }
    var html = results.map(function (r) {
      var s = pageCache[r.p.path] ? snippet(pageCache[r.p.path].raw.replace(/---[\s\S]*?---/g, ""), q) : null;
      return '<a class="sr-item" href="#/' + encodePath(r.p.path) + '">' +
        '<div class="sr-title">' + (ICONS[r.p.held ? "held" : r.p.type] || "") + "<span>" + escapeHtml(r.p.title) + "</span></div>" +
        (s ? '<div class="sr-snippet">' + s + "</div>" : "") +
        "</a>";
    }).join("");
    searchResults.innerHTML = html;
    searchResults.classList.add("open");
  }

  /* ---------- Navigation ---------- */
  window.addEventListener("hashchange", route);
  document.getElementById("menu-toggle").addEventListener("click", function () {
    document.body.classList.toggle("nav-open");
  });
  document.getElementById("nav-backdrop").addEventListener("click", function () {
    document.body.classList.remove("nav-open");
  });
  contentEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".tl-btn");
    if (!btn) return;
    var open = btn.dataset.tl === "open";
    contentEl.querySelectorAll("details.session-card").forEach(function (d) { d.open = open; });
  });

  loadManifest().then(function () {
    route();
  }).catch(function (err) {
    contentEl.innerHTML = '<div class="error-card"><h2>Eridune konnte nicht geladen werden</h2><p>' + escapeHtml(err.message) + "</p><p>Prüfe, ob GitHub Pages aktiviert ist (Settings → Pages → Branch: main, Ordner: /).</p></div>";
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Destilliertes Wiki von Eridune — Welt, Macht und Mythen der Daggerheart-Kampagne.">
<title>Eridune-Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23131109'/%3E%3Cg fill='none' stroke='%23c8c477' stroke-width='3'%3E%3Ccircle cx='32' cy='21' r='10'/%3E%3Ccircle cx='21' cy='40' r='10'/%3E%3Ccircle cx='43' cy='40' r='10'/%3E%3C/g%3E%3C/svg%3E">
<style>
@import url("https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap");

/* Ruß und Messing, Grünspan der Flux-Leitungen */
:root {
  --bg: #151410;
  --bg-panel: #1a1813;
  --bg-card: #1f1c16;
  --bg-hover: #24211a;
  --border: #36312a;
  --border-soft: #29251f;
  --text: #ddd5bf;
  --muted: #9a927b;
  --faint: #6f6858;
  --brass: #c9b46a;
  --brass-bright: #dccb86;
  --verdigris: #79a893;
  --verdigris-dim: rgba(121,168,147,.38);
  --ok: #8aa86e;
  --warn: #c9973e;
  --bad: #b8705e;
  --serif: "Crimson Pro", Georgia, serif;
  --fell: "IM Fell English", "Crimson Pro", Georgia, serif;
  --fell-sc: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --gold: var(--brass);
  --gold-bright: var(--brass-bright);
  --sans: var(--serif);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: var(--serif); font-size: 18.5px; line-height: 1.72;
  font-variant-numeric: oldstyle-nums proportional-nums;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}

::selection { background: rgba(201,180,106,.28); }

a { color: var(--brass); text-decoration: none; border-bottom: 1px solid rgba(201,180,106,.32); transition: color .15s, border-color .15s; }
a:hover { color: var(--brass-bright); border-bottom-color: var(--brass-bright); }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible {
  outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 2px;
}

/* ---------- Layout ---------- */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border-soft);
  overflow-y: auto; overscroll-behavior: contain;
  z-index: 40; scrollbar-width: thin; scrollbar-color: #36312a transparent;
}
.main { margin-left: 280px; min-height: 100vh; }
.content { max-width: 44rem; margin: 0 auto; padding: 64px 48px 96px; }
@media (prefers-reduced-motion: no-preference) {
  .content { animation: fadein .3s ease; }
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Seitenleiste ---------- */
.brand { padding: 28px 22px 18px; }
.brand-row { display: flex; align-items: center; gap: 12px; }
.brand-star { flex: 0 0 auto; color: var(--brass); }
.brand-name { font-family: var(--fell-sc); font-size: 27px; line-height: 1; color: #ebe3cb; letter-spacing: .02em; }
.brand-sub { margin-top: 8px; font-family: var(--fell); font-style: italic; font-size: 15px; color: var(--muted); line-height: 1.4; }
.brand-stand { margin-top: 4px; font-size: 13.5px; color: var(--faint); }

.search-wrap { padding: 4px 18px 8px; position: relative; }
#search {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 3px;
  padding: 7px 12px 7px 32px; font-family: var(--serif); font-size: 16px;
  transition: border-color .15s;
}
#search::placeholder { color: var(--faint); font-style: italic; }
#search:focus { border-color: var(--brass); outline: none; }
.search-icon { position: absolute; left: 29px; top: 15px; color: var(--faint); pointer-events: none; }
#search-results {
  position: absolute; top: 46px; left: 18px; right: 18px; z-index: 60;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px;
  box-shadow: 0 14px 32px rgba(0,0,0,.5); max-height: 60vh; overflow-y: auto; display: none;
}
#search-results.open { display: block; }
.sr-item { display: block; padding: 10px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: var(--bg-hover); }
.sr-title { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; }
.sr-title .type-ic { color: var(--brass); flex: 0 0 auto; }
.sr-snippet { margin-top: 2px; font-size: 14.5px; color: var(--muted); line-height: 1.45; }
.sr-snippet mark { background: rgba(201,180,106,.25); color: var(--brass-bright); padding: 0 2px; border-radius: 2px; }
.sr-empty { padding: 12px 14px; color: var(--faint); font-size: 15px; font-style: italic; }

nav.wikinav { padding: 6px 0 36px; }
.navgroup { margin-top: 14px; }
.navgroup > summary {
  list-style: none; cursor: pointer; user-select: none;
  padding: 3px 22px; font-family: var(--fell-sc); font-size: 17px; color: var(--muted);
  display: flex; align-items: baseline; gap: 8px;
}
.navgroup > summary::-webkit-details-marker { display: none; }
.navgroup > summary .navcount { font-family: var(--serif); font-size: 13.5px; color: var(--faint); }
.navgroup > summary::after {
  content: ""; margin-left: auto; align-self: center; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.navgroup[open] > summary::after { transform: rotate(45deg); }
.navgroup > summary:hover { color: var(--text); }
.navgroup > ul { list-style: none; margin: 2px 0 0; padding: 0; }
.navitem {
  position: relative; display: flex; align-items: center; gap: 9px;
  padding: 3px 22px 3px 24px; border-bottom: none;
  color: var(--muted); font-size: 16.5px; line-height: 1.5;
}
.navitem:hover { color: var(--text); }
.navitem .type-ic { flex: 0 0 auto; opacity: .55; }
.navitem.active { color: var(--brass-bright); }
.navitem.active .type-ic { opacity: 1; color: var(--brass); }
.navitem.active::before {
  content: ""; position: absolute; left: 10px; top: 50%; width: 5px; height: 5px;
  background: var(--brass); transform: translateY(-50%) rotate(45deg);
}
.nav-star { flex: 0 0 auto; color: var(--brass); opacity: .7; }

/* ---------- Seitenkopf ---------- */
.page-head { margin-bottom: 34px; }
.page-head .rule { display: none; }
.eyebrow { display: none; }
h1.page-title {
  font-family: var(--fell); font-weight: 400; font-size: 52px; line-height: 1.08;
  margin: 0; color: #ece4cb; letter-spacing: -.005em; text-wrap: balance;
}
.page-meta {
  margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
  font-family: var(--fell); font-style: italic; font-size: 17px; color: var(--muted);
}
.page-meta .type-line { display: inline-flex; align-items: center; gap: 7px; color: var(--brass); font-style: normal; font-family: var(--fell-sc); font-size: 17.5px; }
.page-meta .type-line .type-ic { opacity: .9; }
.page-meta .aka { color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 15px; color: var(--text); border: none; padding: 0; background: none;
}
.page-meta .chip.status { font-family: var(--serif); font-style: normal; font-size: 14px; padding: 0 8px; border: 1px solid var(--border); border-radius: 3px; }
.chip.status-ok { border-color: rgba(138,168,110,.5); color: #a9c38f; }
.chip.status-warn { border-color: rgba(201,151,62,.5); color: #dcae66; }
.chip.status-bad { border-color: rgba(184,112,94,.5); color: #d39885; }
.kurz { margin: 18px 0 0; font-family: var(--fell); font-size: 21px; font-style: italic; color: #bdb59f; line-height: 1.5; }

/* ---------- Artikel ---------- */
.article { hyphens: auto; -webkit-hyphens: auto; }
.article > p:first-of-type::first-letter {
  float: left; font-family: var(--fell); font-size: 4.4em; line-height: .82;
  padding: 6px 12px 0 0; color: var(--brass);
}
.article h2 {
  font-family: var(--fell); font-weight: 400; font-size: 30px; line-height: 1.2;
  color: #e3dbc2; margin: 46px 0 12px; clear: both;
}
.article h2::before { content: ""; display: block; width: 44px; height: 1px; background: var(--brass); margin-bottom: 14px; opacity: .8; }
.article h2:first-child { margin-top: 10px; }
.article h3 { font-family: var(--fell); font-style: italic; font-weight: 400; font-size: 23px; color: #d8cfb3; margin: 30px 0 8px; }
.article p { margin: 0 0 16px; }
.article strong { font-weight: 600; color: #e9e1c8; }
.article ul, .article ol { margin: 0 0 18px; padding-left: 0; list-style: none; }
.article ul > li, .article ol > li { position: relative; padding-left: 24px; margin-bottom: 8px; }
.article ul > li::before {
  content: ""; position: absolute; left: 5px; top: .7em;
  width: 6px; height: 6px; transform: rotate(45deg);
  border: 1.25px solid var(--brass); opacity: .8;
}
.article ol { counter-reset: n; }
.article ol > li { counter-increment: n; }
.article ol > li::before { content: counter(n) "."; position: absolute; left: 0; color: var(--brass); font-family: var(--fell); }
.article ul.fragen > li { font-style: italic; color: #cfc7b0; }
.article ul.fragen > li::before {
  content: "?"; border: none; transform: none; width: auto; height: auto; top: 0; left: 4px;
  font-family: var(--fell); font-style: normal; font-size: 1.15em; color: var(--verdigris); opacity: 1;
}
.article h2.fragen-kopf { color: var(--verdigris); }
.article h2.fragen-kopf::before { background: var(--verdigris); }
.article blockquote { margin: 20px 0; padding: 2px 0 2px 20px; border-left: 1px solid var(--brass); color: var(--muted); font-style: italic; }
.article hr { border: none; height: 1px; background: var(--border-soft); margin: 30px 0; }
.article code { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 3px; padding: 0 5px; font-size: .85em; color: #cfc8b0; }
.article table { hyphens: manual; border-collapse: collapse; width: 100%; margin: 6px 0 20px; font-size: 16.5px; font-variant-numeric: lining-nums tabular-nums; }
.article th { font-family: var(--fell-sc); font-weight: 400; text-align: left; color: var(--brass); border-bottom: 1px solid var(--border); padding: 6px 10px 6px 0; }
.article td { border-bottom: 1px solid var(--border-soft); padding: 6px 10px 6px 0; vertical-align: top; }
.wikilink-missing { color: var(--verdigris); border-bottom: 1px dotted var(--verdigris-dim); cursor: help; }

.link-cloud { line-height: 2; }
.link-cloud a { white-space: nowrap; }

/* Callouts */
.callout { padding: 12px 18px; margin: 22px 0; background: rgba(201,151,62,.06); border-left: 2px solid var(--warn); }
.callout-title { display: flex; align-items: center; gap: 8px; font-family: var(--fell-sc); font-size: 18px; color: var(--warn); margin-bottom: 4px; }
.callout p { margin: 0; color: #c8c0aa; }

/* Chronik */
.timeline-intro { font-family: var(--fell); font-style: italic; font-size: 20px; color: var(--muted); margin-bottom: 28px; }
.session-card { border: none; border-top: 1px solid var(--border-soft); padding: 0; margin: 0; position: relative; }
.session-card:last-of-type { border-bottom: 1px solid var(--border-soft); }
details.session-card > summary { list-style: none; cursor: pointer; padding: 16px 0 14px; }
details.session-card > summary::-webkit-details-marker { display: none; }
details.session-card > summary:hover .session-title { color: var(--brass-bright); }
.session-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.session-num { font-family: var(--fell); font-size: 20px; color: var(--brass); min-width: 2.2em; }
.session-title { font-family: var(--fell); font-weight: 400; font-size: 24px; color: #e0d8bc; margin: 0; }
.session-date { margin-left: auto; font-size: 15px; color: var(--muted); font-style: italic; }
.session-chev { flex: 0 0 auto; align-self: center; margin-left: 10px; color: var(--faint); transition: transform .18s ease; }
details.session-card[open] .session-chev { transform: rotate(180deg); color: var(--brass); }
.session-body { padding: 0 0 18px 2.2em; }
.session-meta { display: flex; flex-direction: column; gap: 6px; margin: 0 0 4px; }
.tl-controls { display: flex; gap: 16px; margin: 0 0 18px; }
.tl-btn { background: none; border: none; border-bottom: 1px solid var(--border); color: var(--muted); padding: 2px 0; font-family: var(--serif); font-size: 15.5px; cursor: pointer; }
.tl-btn:hover { color: var(--brass-bright); border-bottom-color: var(--brass); }
.chip-row { display: flex; flex-wrap: wrap; gap: 4px 0; align-items: baseline; }
.chip-row { line-height: 2; }
.chip-row > a.chip + a.chip { margin-left: 22px; position: relative; }
.chip-row > a.chip + a.chip::before { content: ""; position: absolute; left: -13px; top: 50%; width: 4px; height: 4px; background: var(--faint); transform: translateY(-50%) rotate(45deg); }
.chip-label { font-family: var(--fell-sc); font-size: 16px; color: var(--faint); width: 96px; flex: 0 0 auto; }
.session-event { margin: 12px 0 0; }
.session-source { margin-top: 12px; font-size: 14.5px; color: var(--faint); font-style: italic; }

/* Erwähnt in & Fuß */
.backlinks { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--border-soft); }
.backlinks-label { font-family: var(--fell-sc); font-size: 18px; color: var(--verdigris); margin-bottom: 6px; }
.backlinks a.chip { display: inline; color: var(--text); border-bottom: 1px solid var(--border); font-size: 16.5px; }
.backlinks a.chip:hover { color: var(--brass-bright); border-bottom-color: var(--brass); }
.page-footer { margin-top: 30px; font-size: 14px; color: var(--faint); font-style: italic; }

/* Zustände */
.loading { color: var(--faint); font-family: var(--fell); font-style: italic; font-size: 21px; padding: 40px 0; }
.error-card { border-left: 2px solid var(--bad); padding: 6px 0 6px 22px; }
.error-card h2 { font-family: var(--fell); font-weight: 400; color: #d39885; margin: 0 0 6px; }

#menu-toggle {
  display: none; position: fixed; top: 12px; left: 12px; z-index: 50;
  background: var(--bg-panel); color: var(--brass); border: 1px solid var(--border); border-radius: 3px;
  width: 42px; height: 42px; cursor: pointer; align-items: center; justify-content: center;
}
#nav-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 35; }

@media (max-width: 920px) {
  .sidebar { transform: translateX(-100%); transition: transform .22s ease; width: 300px; }
  body.nav-open .sidebar { transform: none; box-shadow: 14px 0 40px rgba(0,0,0,.5); }
  body.nav-open #nav-backdrop { display: block; }
  #menu-toggle { display: flex; }
  .main { margin-left: 0; }
  .content { padding: 72px 20px 72px; }
  h1.page-title { font-size: 38px; }
  html, body { font-size: 17.5px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

  var TYPE_LABELS = {
    uebersicht: "Übersicht", timeline: "Timeline", held: "Held", person: "Person",
    ort: "Ort", artefakt: "Artefakt", fraktion: "Fraktion", haus: "Haus", kreatur: "Kreatur", tier: "Tier", fortschritt: "Vermerk",
    konzept: "Konzept", verkehr: "Verkehrsweg", mythus: "Mythos", volk: "Volk", sprache: "Sprache",
    sl_werkzeug: "SL-Werkzeug", vorlage: "Vorlage", spielercharakter: "Spielercharakter"
  };

  /* ---------- Helpers ---------- */
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function encodePath(p) {
    return p.split("/").map(encodeURIComponent).join("/");
  }
  function basename(p) { return p.split("/").pop(); }

  function parseFrontmatter(raw) {
    var fm = { aliases: [] };
    var body = raw;
    var lines = raw.split("\n");
    if (lines[0] && lines[0].trim() === "---") {
      var i = 1;
      var inFm = true;
      var bodyLines = [];
      for (; i < lines.length; i++) {
        if (inFm && lines[i].trim() === "---") { inFm = false; continue; }
        if (inFm) {
          var m = lines[i].match(/^([A-Za-z_]+):\s*(.*)$/);
          if (m) fm[m[1]] = m[2];
        } else {
          bodyLines.push(lines[i]);
        }
      }
      if (!inFm) body = bodyLines.join("\n");
    }
    if (typeof fm.aliases === "string") {
      fm.aliases = fm.aliases.replace(/^\[/, "").replace(/\]$/, "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    }
    return { fm: fm, body: body };
  }

  /* ---------- Fallback-Markdown-Renderer (falls CDN nicht lädt) ---------- */
  function fbInline(s) {
    s = escapeHtml(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
    return s;
  }
  function fbMarkdown(md) {
    var lines = md.split("\n"), out = [], i = 0, m;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
        var lvl = m[1].length;
        out.push("<h" + lvl + ">" + fbInline(m[2]) + "</h" + lvl + ">"); i++; continue;
      }
      if (/^\s*[-*]\s/.test(line)) {
        out.push("<ul>");
        while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) {
          out.push("<li>" + fbInline(lines[i].replace(/^\s*[-*]\s/, "")) + "</li>"); i++;
        }
        out.push("</ul>"); continue;
      }
      if (/^\s*\d+\.\s/.test(line)) {
        out.push("<ul>");
        while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) {
          out.push("<li>" + fbInline(lines[i].replace(/^\s*\d+\.\s/, "")) + "</li>"); i++;
        }
        out.push("</ul>"); continue;
      }
      if (/^>/.test(line)) {
        out.push("<blockquote>");
        while (i < lines.length && /^>/.test(lines[i])) {
          out.push(fbInline(lines[i].replace(/^>\s?/, ""))); i++;
        }
        out.push("</blockquote>"); continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*]\s|\s*\d+\.\s|^>)/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push("<p>" + fbInline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  /* Fallback: bereits erzeugte Wiki-Links vor dem Escapen schützen */
  function fbSafe(md) {
    var keep = [];
    md = md.replace(/<a href="[^"]*">[^<]*<\/a>|<span class="wikilink-missing"[^>]*>[^<]*<\/span>/g, function (t) {
      keep.push(t); return "\u0000" + (keep.length - 1) + "\u0000";
    });
    return fbMarkdown(md).replace(/\u0000(\d+)\u0000/g, function (_, n) { return keep[+n]; });
  }

  /* ---------- Wikilinks ---------- */
  function resolveName(name) {
    var key = String(name).trim().toLowerCase();
    return nameIndex[key] || null;
  }
  function wikilinkHtml(target, label) {
    label = (label || target).trim();
    var entry = resolveName(target);
    if (entry) return '<a href="#/' + encodePath(entry.path) + '">' + escapeHtml(label) + "</a>";
    return '<span class="wikilink-missing" title="Noch keine eigene Seite">' + escapeHtml(label) + "</span>";
  }
  function replaceWikilinks(md) {
    return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (w, t, l) { return wikilinkHtml(t, l); });
  }

  /* ---------- Callouts ---------- */
  function transformCallouts(html) {
    var tpl = document.createElement("template");
    tpl.innerHTML = html;
    var quotes = Array.prototype.slice.call(tpl.content.querySelectorAll("blockquote"));
    quotes.forEach(function (q) {
      var first = q.firstElementChild;
      if (!first) return;
      var m = (first.textContent || "").match(/^\[!(\w+)\]\s*(.*)$/);
      if (!m) return;
      var type = m[1].toLowerCase();
      var div = document.createElement("div");
      div.className = "callout callout-" + type;
      var head = document.createElement("div");
      head.className = "callout-title";
      head.innerHTML = (ICONS.warn || "") + "<span>" + escapeHtml(m[2]) + "</span>";
      first.remove();
      div.appendChild(head);
      while (q.firstChild) div.appendChild(q.firstChild);
      q.replaceWith(div);
    });
    return tpl.innerHTML;
  }

  function mdToHtml(md) {
    var html;
    if (window.marked && marked.parse) { try { html = marked.parse(md); } catch (e) { html = fbSafe(md); } }
    else html = fbSafe(md);
    return transformCallouts(html);
  }

  /* ---------- Manifest laden ---------- */
  function loadManifest() {
    return fetch(MANIFEST_URL).then(function (r) {
      if (!r.ok) throw new Error("manifest.json nicht erreichbar (" + r.status + ")");
      return r.json();
    }).then(function (data) {
      manifest = data;
      manifest.pages.forEach(function (p) {
        p.aliases = p.aliases || [];
        pathIndex[p.path] = p;
        nameIndex[basename(p.path).toLowerCase()] = p;
        p.aliases.forEach(function (a) { nameIndex[a.toLowerCase()] = p; });
      });
      if (manifest.coverage) standEl.textContent = manifest.coverage;
      buildSidebar();
    });
  }

  /* ---------- Sidebar ---------- */
  function buildSidebar() {
    var pages = manifest.pages.slice();
    function byType(t) { return pages.filter(function (p) { return p.type === t; }); }
    var used = {};
    var groups = [
      { label: "Eridune", open: true, items: [pathIndex["index"], pathIndex["Eridune"]] },
      { label: "Orte", open: true, items: byType("ort").filter(function (p) { return p.path !== "Eridune"; }) },
      { label: "Spielercharaktere", open: true, items: byType("spielercharakter") },
      { label: "Personen", open: true, items: byType("person") },
      { label: "Häuser", open: true, items: byType("haus") },
      { label: "Völker", open: true, items: byType("volk") },
      { label: "Fraktionen", open: true, items: byType("fraktion") },
      { label: "Konzepte", open: true, items: byType("konzept") },
      { label: "Verkehr", open: true, items: byType("verkehr") },
      { label: "Kreaturen", open: true, items: byType("kreatur") },
      { label: "Sprache", open: true, items: byType("sprache") },
      { label: "Mythen", open: true, items: byType("mythus") },
      { label: "Artefakte", open: true, items: byType("artefakt") },
      { label: "Tiere", open: true, items: byType("tier") },
      { label: "SL-Werkzeuge", open: false, items: pages.filter(function (p) { return p.type === "sl_werkzeug" || p.type === "vorlage"; }) }
    ];
    groups.forEach(function (g) {
      g.items = (g.items || []).filter(Boolean);
      g.items.forEach(function (p) { used[p.path] = true; });
    });
    groups.push({ label: "Sonstiges", open: false, items: pages.filter(function (p) { return !used[p.path]; }) });
    groups.forEach(function (g) {
      if (!g.items || g.items.length === 0) return;
      g.items.sort(function (a, b) { return (b.w || 0) - (a.w || 0) || a.title.localeCompare(b.title, "de"); });
      var det = document.createElement("details");
      det.className = "navgroup";
      if (g.open) det.open = true;
      var sum = document.createElement("summary");
      sum.innerHTML = escapeHtml(g.label) + ' <span class="navcount">' + g.items.length + "</span>";
      det.appendChild(sum);
      var ul = document.createElement("ul");
      g.items.forEach(function (p) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "navitem";
        a.href = "#/" + encodePath(p.path);
        a.dataset.path = p.path;
        a.innerHTML = (ICONS[p.held ? "held" : p.type] || "") + "<span>" + escapeHtml(p.title) + "</span>" + ((p.w || 0) >= 70 ? '<svg class="nav-star" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-label="Zentraler Eintrag"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>' : "");
        a.addEventListener("click", function () { document.body.classList.remove("nav-open"); });
        li.appendChild(a);
        ul.appendChild(li);
      });
      det.appendChild(ul);
      navEl.appendChild(det);
    });
  }
  function markActive(path) {
    navEl.querySelectorAll(".navitem").forEach(function (a) {
      a.classList.toggle("active", a.dataset.path === path);
    });
  }

  /* ---------- Seiten laden & rendern ---------- */
  function fetchPage(path) {
    if (pageCache[path]) return Promise.resolve(pageCache[path]);
    var url = "content/" + encodePath(path) + ".md";
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("Seite nicht gefunden (" + r.status + ")");
      return r.text();
    }).then(function (raw) {
      var parsed = parseFrontmatter(raw);
      parsed.raw = raw;
      pageCache[path] = parsed;
      return parsed;
    });
  }

  function statusClass(s) {
    if (!s) return "";
    s = s.toLowerCase();
    if (/lebendig|bei der Gruppe|aktiv|gesund/.test(s)) return "status-ok";
    if (/tot|gestorben|gefallen|zerstört/.test(s)) return "status-bad";
    if (/überfallen|verlassen|verschwunden|unbekannt|beschädigt|verloren/.test(s)) return "status-warn";
    return "";
  }

  function stripLeadingH1(body) {
    return body.replace(/^\s*#\s+[^\n]*\n+/, "");
  }

  function renderHeader(entry, data) {
    var fm = data.fm || {};
    var title = fm.title || entry.title || basename(entry.path);
    var typ = entry.held ? "held" : entry.type;
    var html = '<div class="page-head">';
    html += '<h1 class="page-title">' + escapeHtml(title) + "</h1>";
    var meta = '<span class="type-line">' + (ICONS[typ] || "") + escapeHtml(TYPE_LABELS[typ] || "Eintrag") + "</span>";
    if (fm.status) meta += '<span class="chip status ' + statusClass(fm.status) + '">' + escapeHtml(fm.status) + "</span>";
    if (fm.aliases && fm.aliases.length) meta += '<span class="aka">auch genannt ' + fm.aliases.map(escapeHtml).join(", ") + "</span>";
    html += '<div class="page-meta">' + meta + "</div>";
    if (fm.kurz) html += '<p class="kurz">' + escapeHtml(fm.kurz) + "</p>";
    html += "</div>";
    return html;
  }

  /* Offene Fragen / Ungeklärtes als Fragenliste markieren */
  function decorateFragen(root) {
    root.querySelectorAll(".article h2").forEach(function (h) {
      if (!/^(offene fragen|ungekl|gerüchte)/i.test(h.textContent.trim())) return;
      h.classList.add("fragen-kopf");
      var n = h.nextElementSibling;
      if (n && n.tagName === "UL") n.classList.add("fragen");
    });
  }

  function extractLinks(value) {
    var out = [];
    var re = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
    var m;
    while ((m = re.exec(value)) !== null) out.push(wikilinkHtml(m[1], m[2]));
    return out;
  }

  function renderTimeline(body) {
    var lines = body.split("\n");
    var sessions = [];
    var intro = [];
    var cur = null;
    lines.forEach(function (line) {
      var hm = line.match(/^##\s+Session\s+(\d+)\s*[-–—]\s*(.*)$/);
      if (hm) {
        cur = { num: hm[1], title: hm[2], datum: "", ort: [], bet: [], ereignis: [], quelle: "" };
        sessions.push(cur);
        return;
      }
      if (cur) {
        var m;
        if ((m = line.match(/^- Datum \(in-world\):\s*(.*)$/))) cur.datum = m[1];
        else if ((m = line.match(/^- Orte:\s*(.*)$/))) cur.ort = extractLinks(m[1]);
        else if ((m = line.match(/^- Beteiligte:\s*(.*)$/))) cur.bet = extractLinks(m[1]);
        else if ((m = line.match(/^- Ereignis:\s*(.*)$/))) cur.ereignis.push(m[1]);
        else if ((m = line.match(/^- Quelle:\s*(.*)$/))) cur.quelle += m[1];
      } else {
        if (/^#\s/.test(line) || !line.trim()) return;
        intro.push(line);
      }
    });
    if (sessions.length === 0) return mdToHtml(replaceWikilinks(stripLeadingH1(body)));
    var html = "";
    if (intro.length) html += '<p class="timeline-intro">' + mdToHtml(replaceWikilinks(intro.join(" "))) + "</p>";
    html += '<div class="tl-controls"><button class="tl-btn" data-tl="open" type="button">Alle aufklappen</button><button class="tl-btn" data-tl="close" type="button">Alle zuklappen</button></div>';
    sessions.forEach(function (s, idx) {
      html += '<details class="session-card"' + (idx === sessions.length - 1 ? " open" : "") + ">";
      html += '<summary class="session-head">';
      html += '<span class="session-num">Session ' + s.num + "</span>";
      html += '<h3 class="session-title">' + escapeHtml(s.title) + "</h3>";
      if (s.datum) html += '<span class="session-date">' + escapeHtml(s.datum) + "</span>";
      html += '<svg class="session-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      html += "</summary>";
      html += '<div class="session-body">';
      var chips = function (label, arr) {
        if (!arr.length) return "";
        return '<div class="chip-row"><span class="chip-label">' + label + "</span>" + arr.join("") + "</div>";
      };
      html += '<div class="session-meta">' + chips("Orte", s.ort) + chips("Beteiligte", s.bet) + "</div>";
      if (s.ereignis.length) {
        html += '<p class="session-event">' + mdToHtml(replaceWikilinks(s.ereignis.join(" "))).replace(/^<p>|<\/p>$/g, "") + "</p>";
      }
      if (s.quelle) html += '<div class="session-source">Quelle: ' + escapeHtml(s.quelle) + "</div>";
      html += "</div></details>";
    });
    return html;
  }

  function renderBacklinks(entry) {
    if (!searchReady) return "";
    var name = basename(entry.path).toLowerCase();
    var aliases = entry.aliases || [];
    var re = new RegExp("\\[\\[\\s*(?:" + [name].concat(aliases).map(function (n) { return n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")\\s*(?:\\||\\]\\])", "i");
    var hits = [];
    Object.keys(pageCache).forEach(function (p) {
      if (p === entry.path) return;
      if (re.test(pageCache[p].raw)) hits.push(pathIndex[p]);
    });
    hits.sort(function (a, b) { return a.title.localeCompare(b.title, "de"); });
    if (!hits.length) return "";
    var html = '<div class="backlinks"><div class="backlinks-label">Erwähnt in</div><div class="chip-row">';
    hits.forEach(function (h) {
      html += '<a class="chip" href="#/' + encodePath(h.path) + '">' + escapeHtml(h.title) + "</a>";
    });
    return html + "</div></div>";
  }

  function decorateUebersicht(root) {
    root.querySelectorAll("p").forEach(function (p) {
      var links = p.querySelectorAll("a");
      if (links.length >= 4 && (p.textContent.match(/·/g) || []).length >= 3) p.classList.add("link-cloud");
    });
  }

  function route() {
    var raw = location.hash.replace(/^#\/?/, "");
    var path = raw ? raw.split("/").map(decodeURIComponent).join("/") : "index";
    var entry = pathIndex[path] || resolveName(path);
    if (entry) path = entry.path, entry = pathIndex[path];
    contentEl.innerHTML = '<div class="loading">Lade Eridune …</div>';
    markActive(entry ? entry.path : null);

    if (!entry) {
      contentEl.innerHTML = '<div class="error-card"><h2>Kein Eintrag gefunden</h2><p>Für „' + escapeHtml(path) + "“ existiert keine Seite. Vielleicht ein veralteter Link — die Übersicht hilft weiter.</p></div>";
      document.title = "Unbekannt · Eridune-Wiki";
      return;
    }

    fetchPage(entry.path).then(function (data) {
      currentEntry = entry;
      var fm = data.fm || {};
      var body = data.body;
      var html = renderHeader(entry, data);
      var inner;
      if (entry.type === "timeline") inner = renderTimeline(body);
      else inner = mdToHtml(replaceWikilinks(stripLeadingH1(body)));
      html += '<div class="article">' + inner + "</div>";
      html += renderBacklinks(entry);
      html += '<div class="page-footer">Was am Tisch gilt. Was dahinter liegt, erfahrt ihr im Spiel.</div>';
      contentEl.innerHTML = html;
      if (entry.type === "uebersicht") decorateUebersicht(contentEl);
      decorateFragen(contentEl);
      document.title = (fm.title || entry.title) + " · Eridune-Wiki";
      window.scrollTo(0, 0);
      ensureSearchIndex();
    }).catch(function (err) {
      contentEl.innerHTML = '<div class="error-card"><h2>Seite konnte nicht geladen werden</h2><p>' + escapeHtml(err.message) + "</p></div>";
    });
  }

  /* ---------- Suchindex ---------- */
  function ensureSearchIndex() {
    if (searchReady || searchKicking) return;
    searchKicking = true;
    var paths = manifest.pages.map(function (p) { return p.path; });
    var queue = paths.slice();
    function worker() {
      if (!queue.length) {
        if (Object.keys(pageCache).length >= paths.length) {
          searchReady = true;
          searchKicking = false;
          if (currentEntry) {
            var bl = contentEl.querySelector(".backlinks");
            var html = renderBacklinks(currentEntry);
            if (html && !bl) {
              var foot = contentEl.querySelector(".page-footer");
              if (foot) foot.insertAdjacentHTML("beforebegin", html); else contentEl.insertAdjacentHTML("beforeend", html);
            }
          }
          if (searchInput.value.trim()) runSearch();
        }
        return;
      }
      var p = queue.shift();
      fetchPage(p).then(worker).catch(worker);
    }
    for (var i = 0; i < 8; i++) worker();
  }

  /* ---------- Suche ---------- */
  var searchTimer = null;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 140);
  });
  searchInput.addEventListener("focus", function () {
    if (searchInput.value.trim()) runSearch();
    ensureSearchIndex();
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrap")) searchResults.classList.remove("open");
  });

  function snippet(text, q) {
    var idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx < 0) return null;
    var start = Math.max(0, idx - 55);
    var end = Math.min(text.length, idx + q.length + 70);
    var s = (start > 0 ? "… " : "") + text.slice(start, end) + (end < text.length ? " …" : "");
    var esc = escapeHtml(s);
    var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return esc.replace(re, "<mark>$1</mark>");
  }

  function runSearch() {
    var q = searchInput.value.trim();
    if (!q) { searchResults.classList.remove("open"); searchResults.innerHTML = ""; return; }
    if (!searchReady) {
      searchResults.innerHTML = '<div class="sr-empty">Suchindex wird geladen … einen Moment.</div>';
      searchResults.classList.add("open");
      ensureSearchIndex();
      return;
    }
    var ql = q.toLowerCase();
    var results = [];
    manifest.pages.forEach(function (p) {
      var score = 0;
      var t = p.title.toLowerCase();
      if (t.startsWith(ql)) score = 12;
      else if (t.indexOf(ql) >= 0) score = 9;
      else if ((p.aliases || []).some(function (a) { return a.toLowerCase().indexOf(ql) >= 0; })) score = 6;
      var data = pageCache[p.path];
      if (data) {
        if (data.raw.toLowerCase().indexOf(ql) >= 0) score = Math.max(score, 4);
      }
      if (score > 0) results.push({ p: p, score: score + Math.min(4, (p.w || 0) / 25) });
    });
    results.sort(function (a, b) { return b.score - a.score || (b.p.w || 0) - (a.p.w || 0) || a.p.title.localeCompare(b.p.title, "de"); });
    results = results.slice(0, 12);
    if (!results.length) {
      searchResults.innerHTML = '<div class="sr-empty">Nichts gefunden — die Welt schweigt.</div>';
      searchResults.classList.add("open");
      return;
    }
    var html = results.map(function (r) {
      var s = pageCache[r.p.path] ? snippet(pageCache[r.p.path].raw.replace(/---[\s\S]*?---/g, ""), q) : null;
      return '<a class="sr-item" href="#/' + encodePath(r.p.path) + '">' +
        '<div class="sr-title">' + (ICONS[r.p.held ? "held" : r.p.type] || "") + "<span>" + escapeHtml(r.p.title) + "</span></div>" +
        (s ? '<div class="sr-snippet">' + s + "</div>" : "") +
        "</a>";
    }).join("");
    searchResults.innerHTML = html;
    searchResults.classList.add("open");
  }

  /* ---------- Navigation ---------- */
  window.addEventListener("hashchange", route);
  document.getElementById("menu-toggle").addEventListener("click", function () {
    document.body.classList.toggle("nav-open");
  });
  document.getElementById("nav-backdrop").addEventListener("click", function () {
    document.body.classList.remove("nav-open");
  });
  contentEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".tl-btn");
    if (!btn) return;
    var open = btn.dataset.tl === "open";
    contentEl.querySelectorAll("details.session-card").forEach(function (d) { d.open = open; });
  });

  loadManifest().then(function () {
    route();
  }).catch(function (err) {
    contentEl.innerHTML = '<div class="error-card"><h2>Eridune konnte nicht geladen werden</h2><p>' + escapeHtml(err.message) + "</p><p>Prüfe, ob GitHub Pages aktiviert ist (Settings → Pages → Branch: main, Ordner: /).</p></div>";
  });
})();
</script>
</body>
</html>
